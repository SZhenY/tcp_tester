name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows GUI
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-gui
          path: build/bin/tcp-tester.exe

  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
            needs-winres: true
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install go-winres
        if: matrix.needs-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Embed manifest
        if: matrix.needs-winres
        run: go-winres make

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -tags cli -ldflags="-s -w" -o tcp-tester-${{ matrix.name }}${{ matrix.ext }}

      - name: Cleanup winres
        if: matrix.needs-winres
        run: rm -f rsrc_windows_*.syso

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: tcp-tester-${{ matrix.name }}${{ matrix.ext }}

  release:
    runs-on: ubuntu-latest
    needs: [build-windows-gui, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TCP Tester ${{ steps.version.outputs.VERSION }}"
          files: |
            windows-gui/tcp-tester.exe
            windows-amd64/tcp-tester-windows-amd64.exe
            linux-amd64/tcp-tester-linux-amd64
            linux-arm64/tcp-tester-linux-arm64
          generate_release_notes: true
