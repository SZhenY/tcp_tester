name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows GUI
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-gui
          path: build/bin/tcp-tester.exe

  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
            needs-winres: true
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install go-winres
        if: matrix.needs-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Embed manifest
        if: matrix.needs-winres
        run: go-winres make

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -tags cli -ldflags="-s -w" -o tcp-tester-${{ matrix.name }}${{ matrix.ext }}

      - name: Cleanup winres
        if: matrix.needs-winres
        run: rm -f rsrc_windows_*.syso

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: tcp-tester-${{ matrix.name }}${{ matrix.ext }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
        run: fyne package -os android -name tcp-tester -appID com.szheny.tester -tags fyne -icon ico/icon-512.png

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-arm64
          path: tcp-tester.apk

  release:
    runs-on: ubuntu-latest
    needs: [build-windows-gui, build-cli, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TCP Tester ${{ steps.version.outputs.VERSION }}"
          files: |
            windows-gui/tcp-tester-windows-amd64-gui.exe
            windows-amd64/tcp-tester-windows-amd64-cli.exe
            linux-amd64/tcp-tester-linux-amd64-cli
            linux-arm64/tcp-tester-linux-arm64-cli
            android-arm64/tcp-tester.apk
          generate_release_notes: true
